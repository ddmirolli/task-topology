name: Launch components
on:
  pull_request:
    paths: ['grading/**', 'benchmark/**', 'tasks/tier-2-management/**', 'site/**', '.github/workflows/launch.yml', 'package.json', 'package-lock.json', 'core/**', 'tsconfig.json']
  push:
    branches: [main]
    paths: ['grading/**', 'benchmark/**', 'tasks/tier-2-management/**', 'site/**', '.github/workflows/launch.yml', 'package.json', 'package-lock.json', 'core/**', 'tsconfig.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mtb_ephemeral_ci_password
          POSTGRES_DB: mtb_management
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:launch
      - run: python3 -m unittest discover -s benchmark -p 'test_*.py'
      - run: python3 -m unittest discover -s tasks/tier-2-management/tools -p 'test_*.py'
      - run: python3 tasks/tier-2-management/tools/check_postgres.py
        env:
          MTB_EPHEMERAL_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: mtb_ephemeral_ci_password
          PGDATABASE: mtb_management
